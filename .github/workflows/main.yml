name: Build Chess Century APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Project Chess Century
        run: |
          mkdir -p www
          cp index.html www/index.html
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "chess-century",
              version: "1.0.0",
              dependencies: { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
              devDependencies: { "@capacitor/cli": "^7.0.0" }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sepram.chesscentury",
              appName: "Chess Century",
              webDir: "www",
              android: { backgroundColor: "#262b22" }
            }, null, 2));
          '

      - name: Install & Build APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Chess Century APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Century-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
